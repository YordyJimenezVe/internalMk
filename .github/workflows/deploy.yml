name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4


      - name: 🛠️ Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install JS dependencies
        run: npm install

      - name: 🚀 Build assets
        run: npm run build

      - name: 📂 Sync files via SFTP
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          privateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          localDir: '.'
          remoteDir: '/home/maikelca/internal.maikelcars.com/'
          exclude: '.git/*,node_modules/*,vendor/*,tests/*,.env,.env.example,phpunit.xml,vite.config.js,tailwind.config.js,postcss.config.js,composer.json,composer.lock,package.json,package-lock.json,**/*.pdf'
