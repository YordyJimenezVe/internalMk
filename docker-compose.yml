services:
  # PHP Application (Laravel + Composer + Node)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: www-data
        uid: 1000
    image: internalmk-app
    container_name: internalmk-app
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "
      if [ ! -f /var/www/artisan ]; then
        echo '[App] ERROR: /var/www/artisan no disponible (WSL volumen no listo). Saliendo...' >&2;
        sleep 3;
        exit 1;
      fi;
      exec php-fpm
      "
    volumes:
      - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - internalmk-network
    depends_on:
      db:
        condition: service_healthy

  # MariaDB Database
  db:
    image: mariadb:10.4
    container_name: internalmk-db
    restart: unless-stopped
    ports:
      - "3314:3306"
    environment:
      MYSQL_DATABASE: maikelca_inventary
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: user
    volumes:
      - db-data:/var/lib/mysql
      - ./maikelca_inventary.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internalmk-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Nginx Webserver
  webserver:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: internalmk-webserver:latest
    container_name: internalmk-webserver
    restart: unless-stopped
    ports:
      - "8096:80"
    volumes:
      - .:/var/www
    networks:
      - internalmk-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/login > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis Service
  redis:
    image: redis:alpine
    container_name: internalmk-redis
    restart: unless-stopped
    networks:
      - internalmk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

networks:
  internalmk-network:
    driver: bridge

volumes:
  db-data:
    driver: local