services:
  # PHP Application (Laravel + Composer + Node)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: www-data
        uid: 1000
    image: internalmk-app
    container_name: internalmk-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - internalmk-network
    depends_on:
      db:
        condition: service_healthy

  # MariaDB Database
  db:
    image: mariadb:10.4
    container_name: internalmk-db
    restart: unless-stopped
    ports:
      - "3314:3306"
    environment:
      MYSQL_DATABASE: maikelca_inventary
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: user
    volumes:
      - db-data:/var/lib/mysql
      - ./maikelca_inventary.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internalmk-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Nginx Webserver
  webserver:
    image: nginx:alpine
    container_name: internalmk-webserver
    restart: unless-stopped
    ports:
      - "8096:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internalmk-network
    depends_on:
      - app

  # Redis Service
  redis:
    image: redis:alpine
    container_name: internalmk-redis
    restart: unless-stopped
    networks:
      - internalmk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

networks:
  internalmk-network:
    driver: bridge

volumes:
  db-data:
    driver: local
